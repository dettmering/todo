<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 9 17 20 6"/></svg>
          Todo
        </div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="today" href="/today">
          <span class="nav-icon" id="today-icon"></span>
          <span class="nav-label">Heute</span>
          <span class="nav-count" id="today-count"></span>
        </a>
        <a class="nav-item" data-view="upcoming" href="/upcoming">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
          </span>
          <span class="nav-label">Demnächst</span>
        </a>
        <a class="nav-item" data-view="inbox" href="/inbox">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          </span>
          <span class="nav-label">Inbox</span>
          <span class="nav-count" id="inbox-count"></span>
        </a>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-section-header">
          <span>Projekte</span>
          <button class="icon-btn" id="add-project-btn" title="Projekt hinzufügen" aria-label="Projekt hinzufügen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="project-list" id="project-list"></div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <h1 id="view-title">Heute</h1>
        <div class="main-meta" id="view-subtitle"></div>
      </header>

      <div class="quick-add">
        <form id="quick-add-form">
          <div class="quick-add-input-wrap">
            <div class="qa-overlay" id="qa-overlay" aria-hidden="true"></div>
            <input
              type="text"
              id="quick-add-input"
              placeholder="Aufgabe — @datum  #projekt  !!1..4"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="do-it-btn" id="do-it-btn">DO IT</button>
            <div class="qa-project-menu hidden" id="qa-project-menu" role="listbox"></div>
          </div>
        </form>
      </div>

      <ul class="task-list" id="task-list"></ul>
      <div id="empty-state" class="empty hidden">Keine offenen Aufgaben.</div>
    </main>
  </div>

  <dialog id="project-dialog">
    <form method="dialog">
      <h2 id="pd-title">Neues Projekt</h2>
      <label>Name <input type="text" id="pd-name" required /></label>
      <div>
        <span class="dialog-label">Farbe</span>
        <div class="color-swatches" id="pd-swatches"></div>
        <label class="field hex">
          <span>Hex</span>
          <input type="text" id="pd-hex" placeholder="#246fe0" maxlength="7" />
        </label>
      </div>
      <p class="dialog-error hidden" id="pd-error"></p>
      <menu>
        <button value="cancel" type="button" id="pd-cancel">Abbrechen</button>
        <button value="default" type="button" id="pd-delete" class="danger hidden">Löschen</button>
        <button value="default" id="pd-save">Speichern</button>
      </menu>
    </form>
  </dialog>

  <dialog id="task-dialog" class="task-modal">
    <div class="td-layout">
      <header class="td-topbar">
        <div class="td-breadcrumb">
          <span class="td-breadcrumb-dot" id="td-breadcrumb-dot"></span>
          <span class="td-breadcrumb-name" id="td-breadcrumb-name"></span>
        </div>
        <button type="button" class="td-close" id="td-close" aria-label="Schließen" title="Schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </header>

      <section class="td-main">
        <div class="td-title-row">
          <div class="checkbox" id="td-checkbox" title="Erledigen"></div>
          <textarea id="td-title" class="td-title" rows="1" placeholder="Titel" required></textarea>
        </div>
        <div class="td-description-wrap">
          <div class="td-description-rendered" id="td-description-rendered" title="Klicken zum Bearbeiten"></div>
          <textarea id="td-description" class="td-description-input hidden" placeholder="Beschreibung"></textarea>
        </div>
        <p class="dialog-error hidden" id="td-error"></p>
      </section>

      <aside class="td-sidebar">
        <div class="td-field">
          <div class="td-field-label">Projekt</div>
          <div class="td-field-control"><select id="td-project"></select></div>
        </div>

        <div class="td-field">
          <div class="td-field-label">Datum</div>
          <div class="td-field-control">
            <input type="text" id="td-visible-from" placeholder="heute, mo, 27.5., KW 32" autocomplete="off" />
            <span class="date-hint" data-for="td-visible-from"></span>
          </div>
          <div class="td-quick-buttons">
            <button type="button" class="td-quick" data-quick="today" title="Heute">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/></svg>
              <span>Heute</span>
            </button>
            <button type="button" class="td-quick" data-quick="tomorrow" title="Morgen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><polyline points="13 6 19 12 13 18"/></svg>
              <span>Morgen</span>
            </button>
            <button type="button" class="td-quick" data-quick="weekend" title="Wochenende">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 18 0"/><path d="M3 12a9 9 0 0 0 18 0"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/></svg>
              <span>Wochenende</span>
            </button>
            <button type="button" class="td-quick" data-quick="monday" title="Nächster Montag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
              <span>Nächster Mo</span>
            </button>
          </div>
        </div>

        <div class="td-field">
          <div class="td-field-label">Deadline</div>
          <div class="td-field-control">
            <input type="text" id="td-deadline" placeholder="morgen, +5, ende juni" autocomplete="off" />
            <span class="date-hint" data-for="td-deadline"></span>
          </div>
        </div>

        <div class="td-field">
          <div class="td-field-label">Priorität</div>
          <div class="td-priority-buttons" id="td-priority-buttons">
            <button type="button" class="td-prio p1" data-priority="1">P1</button>
            <button type="button" class="td-prio p2" data-priority="2">P2</button>
            <button type="button" class="td-prio p3" data-priority="3">P3</button>
            <button type="button" class="td-prio p4" data-priority="4">P4</button>
          </div>
          <input type="hidden" id="td-priority" value="4" />
        </div>

        <div class="td-field">
          <div class="td-field-label">Wiederholung</div>
          <div class="td-field-control"><select id="td-recurrence"></select></div>
          <div class="td-field-control td-recur-custom hidden" id="td-recur-custom-wrap">
            <input type="text" id="td-recur-custom" placeholder="FREQ=WEEKLY;BYDAY=MO" />
          </div>
        </div>

        <div class="td-sidebar-actions">
          <button type="button" id="td-delete" class="td-link-danger">Löschen</button>
          <div class="td-sidebar-buttons">
            <button type="button" id="td-cancel" class="td-btn">Abbrechen</button>
            <button type="button" id="td-save" class="td-btn td-btn-primary">Speichern</button>
          </div>
        </div>
      </aside>
    </div>
  </dialog>

  <script src="/static/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
